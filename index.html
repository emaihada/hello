<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3E9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>손글씨 십자말풀이</title>
    <meta name="description" content="실제 한글 획 손글씨 인식과 타이핑, 두 손가락 줌, 스테이지 진행 및 자동 저장 기능을 갖춘 웜톤 한글 십자말풀이 게임" />
    <meta property="og:title" content="손글씨 십자말풀이" />
    <meta property="og:description" content="실제 한글 획 손글씨 인식과 타이핑, 두 손가락 줌, 스테이지 진행 및 자동 저장 기능을 갖춘 웜톤 한글 십자말풀이 게임" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F7F3E9;
        color: #2C2520;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <script data-apk-raw-fallback>
      window.__loadApkFallbackBundle = function () {
        if (window.__apkFallbackLoaded) return;
        window.__apkFallbackLoaded = true;
        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = './public/apk-bundle.css';
        cssLink.onerror = function () {
          var altCss = document.createElement('link');
          altCss.rel = 'stylesheet';
          altCss.href = './apk-bundle.css';
          document.head.appendChild(altCss);
        };
        document.head.appendChild(cssLink);

        var jsScript = document.createElement('script');
        jsScript.src = './public/apk-bundle.js';
        jsScript.onerror = function () {
          var altJs = document.createElement('script');
          altJs.src = './apk-bundle.js';
          document.body.appendChild(altJs);
        };
        document.body.appendChild(jsScript);
      };
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', window.__loadApkFallbackBundle);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__loadApkFallbackBundle && window.__loadApkFallbackBundle()"></script>
  </body>
</html>
